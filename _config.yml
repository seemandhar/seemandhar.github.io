# Basic Information 
title: Seemandhar Jain
position: PhD in CS
affiliation: University of California San Diego
email: sejain@ucsd.edu <br> sj68@illinois.edu

# Search Engine Optimization (SEO)
# The following information is used to improve the website traffic from search engines, e.g., Google.
keywords: Seemandhar Jain, UCSD, UC San Diego, PhD, computer vision, 3D Gaussian Splatting, Manmohan Chandraker
description: Seemandhar Jain is a PhD student in Computer Science at UC San Diego, advised by Prof. Manmohan Chandraker, working on 3D vision, Gaussian Splatting, and autonomous AI research agents.
canonical: https://seemandharjain.com/
url: https://seemandharjain.com

# Links 
# If you don't need one of them, you may delete the corresponding line.
google_scholar: https://scholar.google.com/citations?user=Fi0JMRYAAAAJ
cv_link: https://seemandhar.github.io/assets/files/curriculum_vitae.pdf
github_link: https://github.com/jainsee24
linkedin: https://www.linkedin.com/in/seemandharjain/

# Images (e.g., your profile picture and your website's favicon) 
# "favicon" and "favicon_dark" are used for the light and dark modes, respectively. 
avatar: ./assets/img/ezgif.com-animated-gif-maker.gif
favicon: ./assets/img/fav.png
favicon_dark: ./assets/img/fav.png

# Footnote
# You may use the option to disable the footnote, "Powered by Jekyll and Minimal Light theme."
enable_footnote: false

# Auto Dark Mode
# You may use the option to disable the automatic dark theme
auto_dark_mode: true

# Font
# You can use this option to choose between Serif or Sans Serif fonts.
font: "Serif" # or "Sans Serif"

# Use this project as a remote theme for GitHub Pages
# See the guide here: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
remote_theme: yaoyao-liu/minimal-light

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/

# Ensure Next.js exported assets under /ubuntu/_next are served
include:
  - ubuntu/_next
  - ubuntu/next

plugins:
  - jekyll-sitemap

defaults:
  - scope: {path: "docs"}
    values: {sitemap: false}
  - scope: {path: "test-viz.html"}
    values: {sitemap: false}
  - scope: {path: "xx.html"}
    values: {sitemap: false}
  - scope: {path: "ubuntu/404"}
    values: {sitemap: false}
  - scope: {path: "ubuntu/files"}
    values: {sitemap: false}
  - scope: {path: "assets/files/-11.pdf"}
    values: {sitemap: false}
