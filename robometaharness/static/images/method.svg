<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1010" viewBox="0 0 1560 1010" role="img" aria-labelledby="title desc"><title id="title">RoboMetaHarness: discover the harness, keep the policy frozen</title><desc id="desc">A research loop grounds hypotheses in failure evidence, implements and freezes a wrapper, then evaluates against baseline and null controls. Failure analysis feeds reusable memory. A candidate advances from replay audit to development, fresh validation and full evaluation only when its gates pass. At runtime, public observations pass through a harness around a frozen policy; the evaluator remains separate.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#79849a" stroke-width="2"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e8eaf2"/></pattern></defs><rect x="0" y="0" width="1560" height="1010" rx="24" fill="#fafbfe" stroke="#fafbfe"/><rect x="0" y="0" width="1560" height="1010" fill="url(#dots)" rx="24"/><text x="44" y="53" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#172033" text-anchor="start">RoboMetaHarness</text><text x="44" y="88" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#536079" text-anchor="start">Discover the harness. Keep the policy frozen.</text><rect x="1216" y="34" width="300" height="46" rx="23" fill="#eef0ff" stroke="#dcdcff"/><text x="1366" y="64" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="middle">0 model-training steps</text><text x="44" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4f46e5" text-anchor="start">01   RESEARCH TIME</text><text x="1514" y="136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536079" text-anchor="end">Policy + benchmark + budget</text><rect x="44" y="160" width="328" height="158" rx="18" fill="#ffffff" stroke="#dce1eb"/><rect x="64" y="180" width="33" height="33" rx="9" fill="#eef0ff" stroke="#eef0ff"/><text x="80.5" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4f46e5" text-anchor="middle">1</text><text x="111" y="204" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Ground &amp; diagnose</text><text x="65" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Inspect the policy interface.</text><text x="65" y="278" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Retrieve mechanisms and failures.</text><rect x="424" y="160" width="328" height="158" rx="18" fill="#ffffff" stroke="#dce1eb"/><rect x="444" y="180" width="33" height="33" rx="9" fill="#eef0ff" stroke="#eef0ff"/><text x="460.5" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4f46e5" text-anchor="middle">2</text><text x="491" y="204" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Propose &amp; review</text><text x="445" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Form a falsifiable hypothesis.</text><text x="445" y="278" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Specify intervention, cost and null.</text><rect x="804" y="160" width="328" height="158" rx="18" fill="#ffffff" stroke="#dce1eb"/><rect x="824" y="180" width="33" height="33" rx="9" fill="#eef0ff" stroke="#eef0ff"/><text x="840.5" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4f46e5" text-anchor="middle">3</text><text x="871" y="204" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Implement &amp; freeze</text><text x="825" y="250" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Build a compatible wrapper.</text><text x="825" y="278" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="start">Pin code, cases and checkpoints.</text><path d="M372 239 H414" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M752 239 H794" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1184" y="160" width="332" height="158" rx="18" fill="#effaf5" stroke="#bfe5d0"/><text x="1208" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#16634a" text-anchor="start">Reusable research memory</text><text x="1208" y="242" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#3e6e5b" text-anchor="start">Mechanisms · traces · costs</text><text x="1208" y="271" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#3e6e5b" text-anchor="start">Failed attempts · transfer limits</text><path d="M1350 318 V344 H208 V328" fill="none" stroke="#5c9c83" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="780" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#517e6d" text-anchor="middle">Analyze failure → update evidence → test a different hypothesis</text><path d="M967 318 V398 H965 V420" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="420" width="1472" height="197" rx="18" fill="#ffffff" stroke="#dce1eb"/><text x="68" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4f46e5" text-anchor="start">4   MEASURE WITH MATCHED CONTROLS</text><text x="1488" y="455" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536079" text-anchor="end">Advance only after complete, valid evidence</text><rect x="68" y="480" width="326" height="106" rx="12" fill="#f6f7fb" stroke="#e1e5ee"/><text x="231" y="518" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Replay audit</text><text x="231" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#536079" text-anchor="middle">Check public inputs + actions</text><rect x="426" y="480" width="326" height="106" rx="12" fill="#f6f7fb" stroke="#e1e5ee"/><text x="589" y="518" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Development</text><text x="589" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#536079" text-anchor="middle">Candidate vs baseline vs null</text><rect x="784" y="480" width="326" height="106" rx="12" fill="#f6f7fb" stroke="#e1e5ee"/><text x="947" y="518" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Fresh validation</text><text x="947" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#536079" text-anchor="middle">New cases; frozen candidate</text><rect x="1142" y="480" width="326" height="106" rx="12" fill="#f6f7fb" stroke="#e1e5ee"/><text x="1305" y="518" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="middle">Full evaluation</text><text x="1305" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#536079" text-anchor="middle">Complete suite + final review</text><path d="M394 533 H418" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M752 533 H776" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1110 533 H1134" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1516 523 H1536 V345 H1350 V328" fill="none" stroke="#5c9c83" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="44" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4f46e5" text-anchor="start">02   EXECUTION TIME</text><text x="1514" y="666" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#536079" text-anchor="end">Same checkpoint · official horizons · measured inference cost</text><rect x="44" y="694" width="250" height="142" rx="18" fill="#ffffff" stroke="#dce1eb"/><text x="169" y="735" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">Public observations</text><text x="169" y="770" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="middle">Images · instruction</text><text x="169" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="middle">Permitted robot state</text><rect x="346" y="694" width="784" height="142" rx="18" fill="#eef0ff" stroke="#c9c7fb"/><text x="371" y="727" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4f46e5" text-anchor="start">DISCOVERED HARNESS</text><rect x="370" y="744" width="180" height="65" rx="10" fill="#ffffff" stroke="#d6d4f9"/><text x="460" y="784" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#4f46e5" text-anchor="middle">Context / memory</text><rect x="584" y="734" width="276" height="86" rx="12" fill="#4f46e5" stroke="#4f46e5"/><text x="722" y="770" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Frozen robot policy</text><text x="722" y="799" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e2e0ff" text-anchor="middle">Original weights θ</text><rect x="894" y="744" width="212" height="65" rx="10" fill="#ffffff" stroke="#d6d4f9"/><text x="1000" y="784" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#4f46e5" text-anchor="middle">Action selection</text><path d="M294 765 H336" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 777 H574" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M860 777 H884" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1130 765 H1172" fill="none" stroke="#79849a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1184" y="694" width="332" height="142" rx="18" fill="#ffffff" stroke="#dce1eb"/><text x="1350" y="736" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">Execute one action chunk</text><text x="1350" y="773" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#536079" text-anchor="middle">Robot / simulator</text><text x="1350" y="804" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="middle">Observe → replan</text><path d="M1350 836 V862 H169 V846" fill="none" stroke="#79849a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="780" y="887" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#536079" text-anchor="middle">No policy replacement · no auxiliary training · no privileged state at runtime</text><rect x="44" y="914" width="1472" height="61" rx="12" fill="#fff9ed" stroke="#eed9a8"/><text x="780" y="951" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#8b631e" text-anchor="middle">Evaluator only: success labels and reset fixtures. Invalid or incomplete comparisons cannot establish a gain.</text></svg>